# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  solution: 'Everything.sln'

  imageRepository: 'sheshu22/eshoponweb-web'
  dockerRegistryServiceConnection: 'sheshu'
  dockerfilePath: 'src/Web/Dockerfile'
  tag: '$(Build.BuildId)'

steps:
- checkout: self
  clean: true
  displayName: 'Checkout Source Code'

- script: |
    echo "=================================="
    echo "Repository downloaded successfully"
    echo "Current Directory:"
    pwd
    echo "=================================="
    echo "Files in Repository:"
    ls -la
  displayName: 'Verify Repository Checkout'

# Step 2 - Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# Step 4 - Restore NuGet Packages
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages' 
  inputs:
    command: 'restore'
    projects: 'Everything.sln'
    feedsToUse: 'select'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: 'Everything.sln'
    arguments: '--configuration Release --no-restore'


- task: DotNetCoreCLI@2
  inputs:
    command: 'test'
    projects: 'tests/**/*.csproj'
    arguments: '--configuration Release --no-build --logger trx'


- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: false

- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    repository: '$(imageRepository)'
    command: 'build'
    Dockerfile: '$(dockerfilePath)'
    buildContext: '$(Build.SourcesDirectory)'
    tags: |
      $(tag)
      latest

- task: Docker@2
  displayName: 'Push Docker Image'
  inputs:
    containerRegistry: 'Sheshu'
    repository: '$(imageRepository)'
    command: 'push'
    tags: |
      $(tag)
      latest

